channels:
    - conda-forge
    - bioconda
dependencies:
    # core scientific stack (kept at major.minor of the tested build)
    - python=3.11
    - numpy=1.24
    - pandas=2.1
    - scipy=1.11
    - statsmodels=0.14
    - scikit-learn=1.3
    - rpy2=3.5
    # plotting / notebooks
    - matplotlib=3.8
    - seaborn=0.12
    - scanpy=1.9
    - ipython
    - jupyter
    - memory_profiler
    - snakemake=7.32
    # R + core method packages (pinned to the R 4.3 toolchain)
    - r-base=4.3
    - r-numDeriv
    - r-mvtnorm
    - r-Matrix
    - r-softImpute
    - r-biocmanager
    - r-sceasy
    - r-devtools
    - r-seurat=4.4
    - r-sctransform
    - bioconductor-glmgampoi=1.12
    - bioconductor-transformgampoi=1.6
    - bioconductor-scran=1.28
    - bioconductor-clusterprofiler=4.8
    - bioconductor-annotationhub=3.8
    #- bioconductor-deseq2
